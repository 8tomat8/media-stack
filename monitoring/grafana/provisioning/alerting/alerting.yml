apiVersion: 1

# Interpolation: contact point settings and policies expand $VAR from Grafana's environment.
# Rule annotations and query models are NOT interpolated (Grafana 13 file-provisioning docs),
# so annotations use plain {{ $labels.x }}.

contactPoints:
  - orgId: 1
    name: telegram
    receivers:
      - uid: telegram
        type: telegram
        settings:
          bottoken: "$TELEGRAM_BOT_TOKEN"
          chatid: "$TELEGRAM_CHAT_ID"

policies:
  - orgId: 1
    receiver: telegram
    group_by: [alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h

# Thresholds (25% MemAvailable, 20% disk free, 0.5 CPU PSI, 3 restarts in 15m) are calibration knobs.
# Swap occupancy and per-container memory limits are deliberately not alerted.
# Same-host Grafana cannot alert on NAS power loss or its own death.
# NoData/Error = OK unless stated: when VictoriaMetrics or an exporter dies, only ScrapeTargetDown speaks.
groups:
  - orgId: 1
    name: monitoring
    folder: monitoring
    interval: 1m
    rules:
      - uid: host-memory-low
        title: HostMemoryLow
        condition: C
        data:
          - {refId: A, datasourceUid: victoriametrics, relativeTimeRange: {from: 300, to: 0}, model: {refId: A, instant: true, expr: 'node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes'}}
          - {refId: B, datasourceUid: __expr__, model: {refId: B, type: reduce, expression: A, reducer: last}}
          - {refId: C, datasourceUid: __expr__, model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: lt, params: [0.25]}}]}}
        for: 10m
        noDataState: OK
        execErrState: OK
        labels: {severity: critical}
        annotations: {summary: "Host MemAvailable under 25% of RAM"}

      - uid: host-cpu-saturated
        title: HostCpuSaturated
        condition: C
        data:
          - {refId: A, datasourceUid: victoriametrics, relativeTimeRange: {from: 300, to: 0}, model: {refId: A, instant: true, expr: 'rate(node_pressure_cpu_waiting_seconds_total[5m])'}}
          - {refId: B, datasourceUid: __expr__, model: {refId: B, type: reduce, expression: A, reducer: last}}
          - {refId: C, datasourceUid: __expr__, model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [0.5]}}]}}
        for: 15m
        noDataState: OK
        execErrState: OK
        labels: {severity: warning}
        annotations: {summary: "Host CPU saturated: runnable tasks waited over 50% of the time (CPU PSI) for 15m"}

      # increase_prometheus: VictoriaMetrics' increase() can count a newly seen series' existing value.
      # Inner max by: Telegraf splits restart_count by container_status, so merge per container first.
      - uid: container-crash-loop
        title: ContainerCrashLoop
        condition: C
        data:
          - {refId: A, datasourceUid: victoriametrics, relativeTimeRange: {from: 300, to: 0}, model: {refId: A, instant: true, expr: 'increase_prometheus((max by (com_docker_compose_project, container_name) (docker_container_status_restart_count))[15m:30s])'}}
          - {refId: B, datasourceUid: __expr__, model: {refId: B, type: reduce, expression: A, reducer: last}}
          - {refId: C, datasourceUid: __expr__, model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [2]}}]}}
        for: 0s
        noDataState: OK
        execErrState: OK
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.container_name }} restarted 3+ times in 15m (crash loop)"}

      - uid: container-not-running
        title: ContainerNotRunning
        condition: C
        data:
          - {refId: A, datasourceUid: victoriametrics, relativeTimeRange: {from: 300, to: 0}, model: {refId: A, instant: true, expr: 'count by (com_docker_compose_project, container_name) (docker_container_status_exitcode{container_status!="running",com_docker_compose_project!=""})'}}
          - {refId: B, datasourceUid: __expr__, model: {refId: B, type: reduce, expression: A, reducer: last}}
          - {refId: C, datasourceUid: __expr__, model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [0]}}]}}
        for: 5m
        noDataState: OK
        execErrState: OK
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.container_name }} is not running"}

      - uid: container-unhealthy
        title: ContainerUnhealthy
        condition: C
        data:
          - {refId: A, datasourceUid: victoriametrics, relativeTimeRange: {from: 300, to: 0}, model: {refId: A, instant: true, expr: 'count by (com_docker_compose_project, container_name) (docker_container_health_failing_streak{health_status="unhealthy"})'}}
          - {refId: B, datasourceUid: __expr__, model: {refId: B, type: reduce, expression: A, reducer: last}}
          - {refId: C, datasourceUid: __expr__, model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [0]}}]}}
        for: 5m
        noDataState: OK
        execErrState: OK
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.container_name }} is unhealthy"}

      # Self-clears 1 day after the container disappears (no static service list to maintain).
      - uid: container-missing
        title: ContainerMissing
        condition: C
        data:
          - {refId: A, datasourceUid: victoriametrics, relativeTimeRange: {from: 300, to: 0}, model: {refId: A, instant: true, expr: 'count by (com_docker_compose_project, container_name) (present_over_time(docker_container_status_exitcode{com_docker_compose_project!=""}[1d])) unless count by (com_docker_compose_project, container_name) (docker_container_status_exitcode) unless on() (up{job="telegraf"} == 0)'}}
          - {refId: B, datasourceUid: __expr__, model: {refId: B, type: reduce, expression: A, reducer: last}}
          - {refId: C, datasourceUid: __expr__, model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [0]}}]}}
        for: 5m
        noDataState: OK
        execErrState: OK
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.container_name }} disappeared"}

      # A single vanished mount yields 0 via absent() (keeps its mountpoint label) and trips < 0.20;
      # NoData = Alerting covers all three gone at once. A vanished mount is itself an incident.
      - uid: disk-space-low
        title: DiskSpaceLow
        condition: C
        data:
          - {refId: A, datasourceUid: victoriametrics, relativeTimeRange: {from: 300, to: 0}, model: {refId: A, instant: true, expr: 'min by (mountpoint) (node_filesystem_avail_bytes{mountpoint=~"/|/volume1|/volume2"} / node_filesystem_size_bytes) or 0 * absent(node_filesystem_avail_bytes{mountpoint="/"}) or 0 * absent(node_filesystem_avail_bytes{mountpoint="/volume1"}) or 0 * absent(node_filesystem_avail_bytes{mountpoint="/volume2"})'}}
          - {refId: B, datasourceUid: __expr__, model: {refId: B, type: reduce, expression: A, reducer: last}}
          - {refId: C, datasourceUid: __expr__, model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: lt, params: [0.20]}}]}}
        for: 15m
        noDataState: Alerting
        execErrState: OK
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.mountpoint }} has under 20% free space (or the mount is gone)"}

      - uid: scrape-target-down
        title: ScrapeTargetDown
        condition: C
        data:
          - {refId: A, datasourceUid: victoriametrics, relativeTimeRange: {from: 300, to: 0}, model: {refId: A, instant: true, expr: 'up'}}
          - {refId: B, datasourceUid: __expr__, model: {refId: B, type: reduce, expression: A, reducer: last}}
          - {refId: C, datasourceUid: __expr__, model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: lt, params: [1]}}]}}
        for: 3m
        noDataState: Alerting
        execErrState: Alerting
        labels: {severity: critical}
        annotations: {summary: "Scrape target {{ $labels.job }} is down (or VictoriaMetrics is unreachable)"}

      # qbittorrent_up comes from qbittorrent-exporter: 0 when the WebUI API at vpn:5080 does not answer or rejects the API key.
      # max by (server): the `version` label is "" while down, so the raw series changes identity.
      # NoData = OK: exporter itself gone -> ScrapeTargetDown speaks.
      - uid: qbittorrent-down
        title: QbittorrentDown
        condition: C
        data:
          - {refId: A, datasourceUid: victoriametrics, relativeTimeRange: {from: 300, to: 0}, model: {refId: A, instant: true, expr: 'max by (server) (qbittorrent_up)'}}
          - {refId: B, datasourceUid: __expr__, model: {refId: B, type: reduce, expression: A, reducer: last}}
          - {refId: C, datasourceUid: __expr__, model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: lt, params: [1]}}]}}
        for: 5m
        noDataState: OK
        execErrState: OK
        labels: {severity: warning}
        annotations: {summary: "qBittorrent at {{ $labels.server }} is not answering qbittorrent-exporter (down, unreachable or API key rejected)"}
