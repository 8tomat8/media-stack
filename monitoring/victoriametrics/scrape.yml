global:
  scrape_interval: 30s

scrape_configs:
  - job_name: victoriametrics
    static_configs:
      - targets: ["victoriametrics:8428"]
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: telegraf
    static_configs:
      - targets: ["telegraf:9273"]
  - job_name: qbittorrent-exporter
    static_configs:
      - targets: ["qbittorrent-exporter:8000"]
