[agent]
  interval = "30s"
  flush_interval = "30s"
  omit_hostname = true

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  timeout = "10s"
  ## default is running only; ContainerNotRunning/ContainerMissing need the rest
  container_state_include = ["created", "restarting", "running", "removing", "paused", "exited", "dead"]
  docker_label_include = ["com.docker.compose.project", "com.docker.compose.service"]
  ## no per-cpu / per-NIC / per-blkdev series
  perdevice_include = []
  total_include = ["cpu", "blkio", "network"]

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  expiration_interval = "90s"
  ## string_as_label stays default true -> health_status, container_id become labels
  collectors_exclude = ["gocollector", "process"]
